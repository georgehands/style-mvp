<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Style, Decided</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
</head>
<body>
  <div class="app">
    <main id="screen"></main>
    <nav id="tabs" class="tabs hidden">
      <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5V6.6a2.1 2.1 0 1 0-2.1-2.1"/><path d="M12 7.5 3.4 14.2a1.4 1.4 0 0 0 .9 2.5h15.4a1.4 1.4 0 0 0 .9-2.5L12 7.5z"/></svg><span>Wardrobe</span></button>
      <button data-tab="browse"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg><span>Browse</span></button>
      <button data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1.1 12.2H6.6L5.5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>Shopping</span></button>
      <button data-tab="owned"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="1.8"/><path d="M12 3.5v17M10 12h.01M14 12h.01"/></svg><span>Owned</span></button>
      <button data-tab="you"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.6"/><path d="M5 20c1.2-3.7 3.9-5.6 7-5.6s5.8 1.9 7 5.6"/></svg><span>You</span></button>
    </nav>
  </div>
  <!-- Netlify Forms reads these at deploy time. The app posts to them from proto.js. -->
  <form name="leads" data-netlify="true" hidden>
    <input name="name"><input name="email"><input name="opt_in"><input name="src"><input name="tried"><input name="goals"><input name="build"><input name="height"><input name="work"><input name="looks"><input name="budget"><input name="monthly">
  </form>
  <form name="checkout-clicks" data-netlify="true" hidden>
    <input name="name"><input name="email"><input name="price"><input name="src"><input name="looks"><input name="budget">
  </form>
  <form name="waitlist" data-netlify="true" hidden>
    <input name="name"><input name="email"><input name="src">
  </form>
  <script src="catalogue.js"></script>
  <script src="art.js"></script>
  <script src="proto.js"></script>
</body>
</html>
